name: Release
on:
  workflow_dispatch:
    inputs:
      gem:
        description: Gem to publish
        required: true
        type: choice
        options:
          - fanotify.rb
          - fanotify_utils
      tag:
        description: Existing tag (for example fanotify.rb/v0.1.0 or fanotify_utils/v0.1.0)
        required: true
        type: string
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Verify tag matches gem version
        working-directory: gems/${{ inputs.gem }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_GEM: ${{ inputs.gem }}
        run: |
          ruby -rrubygems -e '
            spec = Gem::Specification.load("#{ENV.fetch("RELEASE_GEM")}.gemspec")
            abort "Cannot load gemspec" unless spec
            expected = "#{spec.name}/v#{spec.version}"
            actual = ENV.fetch("RELEASE_TAG")
            abort "Expected tag #{expected}, got #{actual}" unless actual == expected
          '
          tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          test_commit=$(git rev-parse HEAD)
          if [ "$tag_commit" != "$test_commit" ]; then
            echo "Tag $RELEASE_TAG does not point to the tested commit. Select that tag under Run workflow."
            exit 1
          fi
      - name: Build and verify both packages
        run: sh script/check-packages
      - name: Publish gem
        uses: rubygems/release-gem@v1
        with:
          working-directory: gems/${{ inputs.gem }}
